name: Build and Publish Snapshots

# Self-publication (T60, D-083). Three jobs, in order:
#   verify   the reusable workflow builds and tests develop (publish-snapshots stays false: it never deploys to Central).
#   publish  environment git-publisher-snapshots (deploys from develop only): `./mvnw install`, then the installed plugin's
#            deploy goal by full coordinates, publishing this project's snapshots to zenwave360/maven-snapshots, branch gh-pages.
#            Never main. The token reaches Maven only as the env GIT_PUBLISHER_TOKEN of the publish steps.
#   consumer a clean consumer (empty local repository) resolves the published plugin and core from raw.githubusercontent.com.
# Runs on push to develop and on workflow_dispatch. This is the only workflow that names environment git-publisher-snapshots.
# Secrets are passed by name, never with `secrets: inherit`.

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: zenwave360/release-workflows/.github/workflows/publish-snapshots-maven.yml@3c40e2706b34b436b2c6e6dbaa431fed329c5f0a # main at 3c40e27
    with:
      publish-snapshots: false
      jacoco-csv-files: >
        core/target/site/jacoco/jacoco.csv
        maven-plugin/target/site/jacoco/jacoco.csv
    secrets:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
      SIGN_KEY: ${{ secrets.SIGN_KEY }}
      SIGN_KEY_PASS: ${{ secrets.SIGN_KEY_PASS }}

  publish:
    name: Publish snapshots to zenwave360/maven-snapshots
    needs: verify
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: git-publisher-snapshots
    # Same group for every workflow that publishes io.github.ivangsa coordinates to the snapshots repository (D-083).
    concurrency:
      group: maven-snapshots-io.github.ivangsa
      cancel-in-progress: false
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Read the project version (snapshots only)
        id: version
        run: |
          version="$(./mvnw -B -ntp -q -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1)"
          if ! printf '%s\n' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$'; then
            echo "The project version is not a -SNAPSHOT version; refusing to publish it as a snapshot." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      # No secrets in this step. Installs core and the plugin into the local repository, so the next step runs the installed plugin.
      - name: Install core and the plugin
        run: ./mvnw -B -ntp install -DskipTests -Dinvoker.skip=true

      # The token is scoped to this step. `package` in the same invocation packages the modules the goal publishes (a goal started
      # alone has no packaged artifacts to publish); test-fixtures is excluded because it is never deployed. Nothing is written to
      # the local repository in this step, so the installed plugin and core stay as the previous step left them.
      - name: Publish snapshots with the installed plugin
        env:
          GIT_PUBLISHER_TOKEN: ${{ secrets.GIT_PUBLISHER_TOKEN }}
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        run: >
          ./mvnw -B -ntp -pl '!test-fixtures' package -DskipTests -Dinvoker.skip=true
          io.github.ivangsa:git-maven-publisher-maven-plugin:${PLUGIN_VERSION}:deploy
          -Dgit-publisher.repository=https://github.com/zenwave360/maven-snapshots.git
          -Dgit-publisher.branch=gh-pages

  consumer:
    name: Resolve the published snapshots in a clean consumer
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLUGIN_VERSION: ${{ needs.publish.outputs.version }}
      SNAPSHOTS_URL: https://raw.githubusercontent.com/zenwave360/maven-snapshots/gh-pages/
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Empty local repository under RUNNER_TEMP, Central for the dependencies, the snapshots repository for io.github.ivangsa.
      - name: Resolve the plugin and core from the published branch
        run: |
          m2="${RUNNER_TEMP}/consumer-m2"
          repos="central::default::https://repo.maven.apache.org/maven2,zenwave-snapshots::default::${SNAPSHOTS_URL}"
          for artifact in git-maven-publisher-maven-plugin git-maven-publisher-core; do
            ./mvnw -B -ntp -Dmaven.repo.local="${m2}" \
              org.apache.maven.plugins:maven-dependency-plugin:3.8.1:get \
              -Dartifact="io.github.ivangsa:${artifact}:${PLUGIN_VERSION}" \
              -DremoteRepositories="${repos}"
          done
          for artifact in git-maven-publisher-maven-plugin git-maven-publisher-core; do
            if [ -z "$(find "${m2}/io/github/ivangsa/${artifact}/${PLUGIN_VERSION}" -name '*.jar' -print -quit)" ]; then
              echo "${artifact} ${PLUGIN_VERSION} was not resolved from the published branch." >&2
              exit 1
            fi
          done
