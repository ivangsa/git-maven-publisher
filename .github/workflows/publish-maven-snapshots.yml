name: Build and Publish Snapshots

# Self-publication (T60, D-083). Three jobs, in order:
#   verify   the reusable workflow builds and tests develop (publish-snapshots stays false: it never deploys to Central).
#   publish  environment git-publisher-snapshots (deploys from develop only): `./mvnw install`, then the installed plugin's
#            deploy goal by full coordinates, publishing this project's snapshots to zenwave360/maven-snapshots, branch gh-pages.
#            Then the Gradle plugin and its marker, published by the Gradle plugin itself, built from the same commit (T45, D-111).
#            Never main. The token reaches Maven and Gradle only as the env GIT_PUBLISHER_TOKEN of the publish steps.
#   consumer a clean consumer (empty local repository) resolves the published plugin and core from raw.githubusercontent.com,
#            after it has checked that the branch serves the build that publish read back from the branch (R31, D-102).
#            A second clean consumer (empty Gradle user home) applies the Gradle plugin by its id from pluginManagement.
# Runs on push to develop and on workflow_dispatch. This is the only workflow that names environment git-publisher-snapshots.
# Secrets are passed by name, never with `secrets: inherit`.

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: zenwave360/release-workflows/.github/workflows/publish-snapshots-maven.yml@3c40e2706b34b436b2c6e6dbaa431fed329c5f0a # main at 3c40e27
    with:
      publish-snapshots: false
      jacoco-csv-files: >
        core/target/site/jacoco/jacoco.csv
        maven-plugin/target/site/jacoco/jacoco.csv
    secrets:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
      SIGN_KEY: ${{ secrets.SIGN_KEY }}
      SIGN_KEY_PASS: ${{ secrets.SIGN_KEY_PASS }}

  publish:
    name: Publish snapshots to zenwave360/maven-snapshots
    needs: verify
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: git-publisher-snapshots
    # Same group for every workflow that publishes io.github.ivangsa coordinates to the snapshots repository (D-083).
    concurrency:
      group: maven-snapshots-io.github.ivangsa
      cancel-in-progress: false
    outputs:
      version: ${{ steps.version.outputs.version }}
      core-build: ${{ steps.builds.outputs.core }}
      plugin-build: ${{ steps.builds.outputs.plugin }}
      gradle-plugin-build: ${{ steps.builds.outputs.gradle-plugin }}
      gradle-marker-build: ${{ steps.builds.outputs.gradle-marker }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Read the project version (snapshots only)
        id: version
        run: |
          version="$(./mvnw -B -ntp -q -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1)"
          if ! printf '%s\n' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$'; then
            echo "The project version is not a -SNAPSHOT version; refusing to publish it as a snapshot." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      # No secrets in this step. Installs core and the plugin into the local repository, so the next step runs the installed plugin.
      - name: Install core and the plugin
        run: ./mvnw -B -ntp install -DskipTests -Dinvoker.skip=true

      # The token is scoped to this step. `package` in the same invocation packages the modules the goal publishes (a goal started
      # alone has no packaged artifacts to publish); test-fixtures is excluded because it is never deployed. Nothing is written to
      # the local repository in this step, so the installed plugin and core stay as the previous step left them.
      - name: Publish snapshots with the installed plugin
        env:
          GIT_PUBLISHER_TOKEN: ${{ secrets.GIT_PUBLISHER_TOKEN }}
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        run: >
          ./mvnw -B -ntp -pl '!test-fixtures' package -DskipTests -Dinvoker.skip=true
          io.github.ivangsa:git-maven-publisher-maven-plugin:${PLUGIN_VERSION}:deploy
          -Dgit-publisher.repository=https://github.com/zenwave360/maven-snapshots.git
          -Dgit-publisher.branch=gh-pages

      # The Gradle plugin is published by the Gradle plugin: the first command installs the plugin built from this commit into the
      # local Maven repository (no token), the second applies that installed plugin to the same build through an init script
      # and runs its publication task, so the jar and the marker (io.github.ivangsa.git-maven-publisher.gradle.plugin) reach
      # the branch in one commit. Unsigned: only releases are signed (D-111).
      - name: Install the Gradle plugin built from this commit
        run: ./gradlew -p gradle-plugin publishToMavenLocal

      - name: Publish the Gradle plugin and its marker with the Gradle plugin
        env:
          GIT_PUBLISHER_TOKEN: ${{ secrets.GIT_PUBLISHER_TOKEN }}
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        run: >
          ./gradlew -p gradle-plugin -I "${GITHUB_WORKSPACE}/gradle-plugin/self-publish.init.gradle"
          publishAllPublicationsToGitPublisherRepository

      # Reads the build numbers back from the branch that the previous step pushed (public, no token). The consumer must reach
      # at least these builds (R31, D-102). Shallow clone of gh-pages; the metadata is the one the publication wrote.
      - name: Read the build numbers the branch now holds
        id: builds
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          work="${RUNNER_TEMP}/published-branch"
          git clone --quiet --depth 1 --branch gh-pages --single-branch https://github.com/zenwave360/maven-snapshots.git "${work}"
          read_build() {
            metadata="${work}/$1/${PLUGIN_VERSION}/maven-metadata.xml"
            build="$(sed -n 's#.*<buildNumber>\([0-9][0-9]*\)</buildNumber>.*#\1#p' "${metadata}" | head -n 1)"
            if [ -z "${build}" ]; then
              echo "No build number for $1 ${PLUGIN_VERSION} on the branch: ${metadata}" >&2
              exit 1
            fi
            echo "$2=${build}" >> "${GITHUB_OUTPUT}"
          }
          read_build io/github/ivangsa/git-maven-publisher-core core
          read_build io/github/ivangsa/git-maven-publisher-maven-plugin plugin
          read_build io/github/ivangsa/git-maven-publisher-gradle-plugin gradle-plugin
          read_build io/github/ivangsa/git-maven-publisher/io.github.ivangsa.git-maven-publisher.gradle.plugin gradle-marker

  consumer:
    name: Resolve the published snapshots in a clean consumer
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLUGIN_VERSION: ${{ needs.publish.outputs.version }}
      SNAPSHOTS_URL: https://raw.githubusercontent.com/zenwave360/maven-snapshots/gh-pages/
      PAGES_URL: https://www.zenwave.io/maven-snapshots/
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # raw.githubusercontent.com may serve older metadata for a few minutes after the push. Wait until the branch serves at least
      # the builds that publish read back, and fail when it still serves an older build (R31, D-102).
      - name: Check that the branch serves the build just pushed
        env:
          CORE_BUILD: ${{ needs.publish.outputs.core-build }}
          PLUGIN_BUILD: ${{ needs.publish.outputs.plugin-build }}
        run: |
          served_build() {
            curl --silent --show-error --fail --location "${SNAPSHOTS_URL}io/github/ivangsa/$1/${PLUGIN_VERSION}/maven-metadata.xml" \
              | sed -n 's#.*<buildNumber>\([0-9][0-9]*\)</buildNumber>.*#\1#p' | head -n 1
          }
          for attempt in $(seq 1 15); do
            core="$(served_build git-maven-publisher-core || true)"
            plugin="$(served_build git-maven-publisher-maven-plugin || true)"
            if [ "${core:-0}" -ge "${CORE_BUILD}" ] && [ "${plugin:-0}" -ge "${PLUGIN_BUILD}" ]; then
              echo "The branch serves core build ${core} and plugin build ${plugin}; published: core ${CORE_BUILD}, plugin ${PLUGIN_BUILD}."
              exit 0
            fi
            echo "Attempt ${attempt}: the branch serves core ${core:-none} and plugin ${plugin:-none}; expected at least ${CORE_BUILD} and ${PLUGIN_BUILD}. Waiting for the cache."
            sleep 30
          done
          echo "The branch still serves an older build of ${PLUGIN_VERSION} than the one just pushed (core ${CORE_BUILD}, plugin ${PLUGIN_BUILD})." >&2
          exit 1

      # Empty local repository under RUNNER_TEMP, Central for the dependencies, the snapshots repository for io.github.ivangsa.
      - name: Resolve the plugin and core from the published branch
        run: |
          m2="${RUNNER_TEMP}/consumer-m2"
          repos="central::default::https://repo.maven.apache.org/maven2,zenwave-snapshots::default::${SNAPSHOTS_URL}"
          for artifact in git-maven-publisher-maven-plugin git-maven-publisher-core; do
            ./mvnw -B -ntp -Dmaven.repo.local="${m2}" \
              org.apache.maven.plugins:maven-dependency-plugin:3.8.1:get \
              -Dartifact="io.github.ivangsa:${artifact}:${PLUGIN_VERSION}" \
              -DremoteRepositories="${repos}"
          done
          for artifact in git-maven-publisher-maven-plugin git-maven-publisher-core; do
            if [ -z "$(find "${m2}/io/github/ivangsa/${artifact}/${PLUGIN_VERSION}" -name '*.jar' -print -quit)" ]; then
              echo "${artifact} ${PLUGIN_VERSION} was not resolved from the published branch." >&2
              exit 1
            fi
          done

      # The Gradle plugin is resolved the way the README tells users to: by its id, with the snapshots repository and the Plugin Portal
      # in pluginManagement (T45, D-111). GitHub Pages serves gh-pages at www.zenwave.io/maven-snapshots/; Pages may lag the push,
      # so the same wait as above (R31, D-102) runs against that URL, for the plugin jar and its marker.
      - name: Check that the snapshots site serves the Gradle plugin build just pushed
        env:
          GRADLE_PLUGIN_BUILD: ${{ needs.publish.outputs.gradle-plugin-build }}
          GRADLE_MARKER_BUILD: ${{ needs.publish.outputs.gradle-marker-build }}
        run: |
          served_build() {
            curl --silent --show-error --fail --location "${PAGES_URL}$1/${PLUGIN_VERSION}/maven-metadata.xml" \
              | sed -n 's#.*<buildNumber>\([0-9][0-9]*\)</buildNumber>.*#\1#p' | head -n 1
          }
          plugin_path=io/github/ivangsa/git-maven-publisher-gradle-plugin
          marker_path=io/github/ivangsa/git-maven-publisher/io.github.ivangsa.git-maven-publisher.gradle.plugin
          for attempt in $(seq 1 20); do
            plugin="$(served_build "${plugin_path}" || true)"
            marker="$(served_build "${marker_path}" || true)"
            if [ "${plugin:-0}" -ge "${GRADLE_PLUGIN_BUILD}" ] && [ "${marker:-0}" -ge "${GRADLE_MARKER_BUILD}" ]; then
              echo "${PAGES_URL} serves Gradle plugin build ${plugin} and marker build ${marker}; published: ${GRADLE_PLUGIN_BUILD} and ${GRADLE_MARKER_BUILD}."
              exit 0
            fi
            echo "Attempt ${attempt}: the site serves plugin ${plugin:-none} and marker ${marker:-none}; expected at least ${GRADLE_PLUGIN_BUILD} and ${GRADLE_MARKER_BUILD}. Waiting for Pages."
            sleep 30
          done
          echo "${PAGES_URL} still serves an older Gradle plugin build of ${PLUGIN_VERSION} than the one just pushed (${GRADLE_PLUGIN_BUILD}, marker ${GRADLE_MARKER_BUILD})." >&2
          exit 1

      # Empty Gradle user home. The project uses the pluginManagement block of the README; the plugin id has a version that exists
      # only as a snapshot, so a successful application proves the marker and the jar come from the published site. The build file
      # fails when the extension of the plugin is missing and prints the jar it loaded; the next step compares that jar with the one
      # the site serves now.
      - name: Apply the Gradle plugin by its id from the published site
        run: |
          project="${RUNNER_TEMP}/gradle-consumer"
          mkdir -p "${project}"
          printf '%s\n' \
            "pluginManagement {" \
            "    repositories {" \
            "        maven { url = uri('${PAGES_URL}') }" \
            "        gradlePluginPortal()" \
            "    }" \
            "}" \
            "rootProject.name = 'gradle-consumer'" > "${project}/settings.gradle"
          printf '%s\n' \
            "plugins {" \
            "    id 'io.github.ivangsa.git-maven-publisher' version '${PLUGIN_VERSION}'" \
            "}" \
            "if (project.extensions.findByName('gitMavenPublisher') == null) {" \
            "    throw new GradleException('The plugin was applied without its gitMavenPublisher extension')" \
            "}" \
            "println 'PLUGIN_JAR=' + new File(io.github.ivangsa.gitpublisher.gradle.GitMavenPublisherPlugin.protectionDomain.codeSource.location.toURI()).absolutePath" > "${project}/build.gradle"
          GRADLE_USER_HOME="${RUNNER_TEMP}/consumer-gradle-home" ./gradlew --no-daemon --console=plain -p "${project}" help | tee "${RUNNER_TEMP}/gradle-consumer.log"
          jar="$(sed -n 's/^PLUGIN_JAR=//p' "${RUNNER_TEMP}/gradle-consumer.log" | head -n 1)"
          if [ -z "${jar}" ] || [ ! -f "${jar}" ]; then
            echo "The build did not report the plugin jar it loaded." >&2
            exit 1
          fi
          echo "PLUGIN_JAR_PATH=${jar}" >> "${GITHUB_ENV}"

      - name: Check that the plugin jar is the one the site serves
        env:
          GRADLE_PLUGIN_BUILD: ${{ needs.publish.outputs.gradle-plugin-build }}
        run: |
          plugin_url="${PAGES_URL}io/github/ivangsa/git-maven-publisher-gradle-plugin/${PLUGIN_VERSION}/"
          metadata="$(curl --silent --show-error --fail --location "${plugin_url}maven-metadata.xml")"
          timestamp="$(printf '%s\n' "${metadata}" | sed -n 's#.*<timestamp>\([0-9.]*\)</timestamp>.*#\1#p' | head -n 1)"
          build="$(printf '%s\n' "${metadata}" | sed -n 's#.*<buildNumber>\([0-9][0-9]*\)</buildNumber>.*#\1#p' | head -n 1)"
          if [ -z "${timestamp}" ] || [ -z "${build}" ] || [ "${build}" -lt "${GRADLE_PLUGIN_BUILD}" ]; then
            echo "The site serves build ${build:-none}; the build just pushed is ${GRADLE_PLUGIN_BUILD}." >&2
            exit 1
          fi
          served="git-maven-publisher-gradle-plugin-${PLUGIN_VERSION%-SNAPSHOT}-${timestamp}-${build}.jar"
          expected="$(curl --silent --show-error --fail --location "${plugin_url}${served}.sha1" | tr -d '[:space:]' | cut -c1-40)"
          actual="$(sha1sum "${PLUGIN_JAR_PATH}" | cut -c1-40)"
          if [ "${expected}" != "${actual}" ]; then
            echo "The plugin jar the consumer loaded (${actual}) is not ${served} (${expected})." >&2
            exit 1
          fi
          echo "The consumer applied ${served} (sha1 ${actual}) from ${PAGES_URL}."
