name: Release from Notes

# Maintainer-dispatched release (D-072, D-078). Calls zenwave360/release-workflows release-maven.yml, pinned to a full commit
# SHA (main at 3c40e27). Secrets are passed by name, never with `secrets: inherit`. The Central gate is the environment
# maven-central-upload of this repository: this is the only workflow that names it. Before the first run (T59b): main
# requires PRs, the environment has a required reviewer and deploys from main only, and release-notes/release-notes.v<VERSION>.md
# is committed to main.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without a v prefix (X.Y.Z or X.Y.Z-rc.N)"
        required: true
        type: string
      developmentVersion:
        description: "Next development version (X.Y.Z-SNAPSHOT). Leave empty to derive the next patch SNAPSHOT."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    # The reusable workflow's jobs ask for these; the caller's grant is the ceiling. Nothing here publishes by itself.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: zenwave360/release-workflows/.github/workflows/release-maven.yml@3c40e2706b34b436b2c6e6dbaa431fed329c5f0a # main at 3c40e27
    with:
      version: ${{ inputs.version }}
      development-version: ${{ inputs.developmentVersion }}
      central-environment: maven-central-upload
    secrets:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
      SIGN_KEY: ${{ secrets.SIGN_KEY }}
      SIGN_KEY_PASS: ${{ secrets.SIGN_KEY_PASS }}

  # Gradle plugin to the Plugin Portal (D-083, D-100). Runs after the Maven release job, which only uploads the Central deployment
  # (autoPublish is false): core is on Central only after the maintainer publishes that deployment. The step before publishPlugins
  # fails while core is absent; publish the deployment, then re-run this job. It builds the tag v<version> that release-maven
  # created. The version is the one of the root pom.xml, which the Gradle build reads (D-085).
  # Secrets are passed by name; the Plugin Portal reads GRADLE_PUBLISH_KEY and GRADLE_PUBLISH_SECRET from the environment.
  gradle-plugin:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: maven-central-upload
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check that the tag holds the released version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          pom_version="$(./mvnw -B -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)"
          if [ "${pom_version}" != "${RELEASE_VERSION}" ]; then
            echo "Root pom.xml declares ${pom_version}, expected ${RELEASE_VERSION}" >&2
            exit 1
          fi

      - name: Install core into the local Maven repository
        run: ./mvnw -B -ntp install -DskipTests -Dinvoker.skip=true

      # Gate before publishPlugins (D-100). No secret here. Central serves core only after the maintainer has published the
      # Central deployment of this release; until then the job stops, the Plugin Portal is not touched, and the job is re-run.
      - name: Check that core is on Maven Central
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          core_pom="https://repo1.maven.org/maven2/io/github/ivangsa/git-maven-publisher-core/${RELEASE_VERSION}/git-maven-publisher-core-${RELEASE_VERSION}.pom"
          if ! curl --silent --show-error --fail --location --output /dev/null "${core_pom}"; then
            echo "git-maven-publisher-core ${RELEASE_VERSION} cannot be fetched from Maven Central: ${core_pom}" >&2
            echo "Publish the Central deployment of this release (autoPublish is false), wait until Central serves it, then re-run this job." >&2
            exit 1
          fi

      - name: Publish the Gradle plugin to the Plugin Portal
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew -p gradle-plugin publishPlugins
