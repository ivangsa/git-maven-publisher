name: Release from Notes

# Maintainer-dispatched release (D-072, D-078). Calls zenwave360/release-workflows release-maven.yml, pinned to a full commit
# SHA (main at 3c40e27). Secrets are passed by name, never with `secrets: inherit`. The Central gate is the environment
# maven-central-upload of this repository: this is the only workflow that names it. Before the first run (T59b): main
# requires PRs, the environment has a required reviewer and deploys from main only, and release-notes/release-notes.v<VERSION>.md
# is committed to main.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without a v prefix (X.Y.Z or X.Y.Z-rc.N)"
        required: true
        type: string
      developmentVersion:
        description: "Next development version (X.Y.Z-SNAPSHOT). Leave empty to derive the next patch SNAPSHOT."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    # The reusable workflow's jobs ask for these; the caller's grant is the ceiling. Nothing here publishes by itself.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: zenwave360/release-workflows/.github/workflows/release-maven.yml@3c40e2706b34b436b2c6e6dbaa431fed329c5f0a # main at 3c40e27
    with:
      version: ${{ inputs.version }}
      development-version: ${{ inputs.developmentVersion }}
      central-environment: maven-central-upload
    secrets:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
      SIGN_KEY: ${{ secrets.SIGN_KEY }}
      SIGN_KEY_PASS: ${{ secrets.SIGN_KEY_PASS }}

  # Gradle plugin to Maven Central (D-083, D-111; no Plugin Portal account). Runs after the Maven release job and uploads a second
  # Central deployment: the plugin jar and its marker (io.github.ivangsa.git-maven-publisher.gradle.plugin), signed with the same
  # key. publishingType is USER_MANAGED, like autoPublish false on the Maven side: the maintainer publishes both deployments in the
  # Central Portal, the core deployment first (the plugin depends on core). Users resolve the release through the default
  # gradlePluginPortal(), which redirects marker requests that exist only on Central to Maven Central.
  # It builds the tag v<version> that release-maven created. The version is the one of the root pom.xml, which the Gradle build
  # reads (D-085). Secrets are passed by name, only to the steps that need them.
  gradle-plugin:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: maven-central-upload
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check that the tag holds the released version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          pom_version="$(./mvnw -B -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)"
          if [ "${pom_version}" != "${RELEASE_VERSION}" ]; then
            echo "Root pom.xml declares ${pom_version}, expected ${RELEASE_VERSION}" >&2
            exit 1
          fi

      - name: Install core into the local Maven repository
        run: ./mvnw -B -ntp install -DskipTests -Dinvoker.skip=true

      # The Gradle build signs with the in-memory key of SIGN_KEY / SIGN_KEY_PASS (never written to disk) and zips the staging
      # repository into the Central Portal bundle. No Central credentials here.
      - name: Build the signed Central bundle of the Gradle plugin
        env:
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
          SIGN_KEY_PASS: ${{ secrets.SIGN_KEY_PASS }}
        run: ./gradlew -p gradle-plugin centralBundle

      # Central Portal API: POST /api/v1/publisher/upload, bearer token = base64(username:token). The header goes to curl on
      # stdin, not on the command line. publishingType=USER_MANAGED: the deployment waits in the Portal until it is published by hand.
      - name: Upload the bundle to the Central Portal
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          bundle="gradle-plugin/build/central-bundle/git-maven-publisher-gradle-plugin-${RELEASE_VERSION}-central-bundle.zip"
          bearer="$(printf '%s:%s' "${CENTRAL_USERNAME}" "${CENTRAL_TOKEN}" | base64 -w0)"
          echo "::add-mask::${bearer}"
          if ! printf 'header = "Authorization: Bearer %s"\n' "${bearer}" | curl --silent --show-error --fail-with-body --max-time 600 \
            --config - \
            --request POST \
            --form "bundle=@${bundle}" \
            --output deployment-id.txt \
            "https://central.sonatype.com/api/v1/publisher/upload?name=git-maven-publisher-gradle-plugin-${RELEASE_VERSION}&publishingType=USER_MANAGED"; then
            echo "Central upload failed; its answer:" >&2
            cat deployment-id.txt >&2 || true
            echo >&2
            exit 1
          fi
          deployment_id="$(cat deployment-id.txt)"
          echo "Uploaded; Central deployment id: ${deployment_id}"
          {
            echo "### Gradle plugin deployment uploaded"
            echo "Central deployment id: ${deployment_id}. Publish the core deployment first, then this one, in the Central Portal."
          } >> "${GITHUB_STEP_SUMMARY}"
