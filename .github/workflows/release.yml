name: Release to Maven Central

# Manual only (D-072). Builds the release from main with the version given at dispatch, signs it and uploads the
# deployment to the Central portal with autoPublish=false: the deployment waits there until a maintainer publishes it.
# This is the only workflow that names environment maven-central-upload. It is not a release: it does not commit,
# tag or create a GitHub release (D-077).
#
# Secrets are environment-scoped (CENTRAL_USERNAME, CENTRAL_TOKEN, SIGN_KEY, SIGN_KEY_PASS), never repository-level.
# The upload job runs the project's own build with all four present; it only runs after the environment gate.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without a v prefix (X.Y.Z or X.Y.Z-rc.N)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build, sign and upload the Central deployment (autoPublish=false)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: maven-central-upload
    steps:
      - name: Require dispatch from main
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Release must be dispatched from main. Got '${GITHUB_REF}'."
            exit 1
          fi

      - name: Validate version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "${INPUT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::version must match X.Y.Z or X.Y.Z-rc.N (no v prefix). Got '${INPUT_VERSION}'."
            exit 1
          fi

      - name: Check out the dispatched commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "17"
          distribution: temurin
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          # Maven 3.10+ only sends credentials to explicitly declared origins.
          mvn-server-repository-origins: |
            central:https://central.sonatype.com

      # Tests and ITs run at the snapshot version, exactly as in CI. The invoker ITs pin the plugin version, so they
      # cannot run at the release version; the sources are the same, only the version string changes below (D-077).
      - name: Build and test at the current version
        run: ./mvnw -B -ntp verify

      # Not committed: the release version exists only in this checkout, for this deployment.
      - name: Set the release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ./mvnw -B -ntp org.codehaus.mojo:versions-maven-plugin:2.23.0:set \
            -DnewVersion="${VERSION}" -DprocessAllModules=true -DgenerateBackupPoms=false

      # The release profile signs in-process with the armored key (maven-gpg-plugin signer bc) and uploads the bundle
      # (central-publishing-maven-plugin, autoPublish=false). The key only exists in these two environment variables.
      # Tests were run above; this step does not run them again.
      - name: Build, sign and upload to Central (autoPublish=false)
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_KEY: ${{ secrets.SIGN_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SIGN_KEY_PASS }}
        run: ./mvnw -B -ntp -Prelease deploy -DskipTests -Dinvoker.skip=true
