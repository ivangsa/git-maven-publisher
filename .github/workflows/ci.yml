name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test (includes the Reposilite E2E profile, needs Docker)
        run: ./mvnw -B verify -Pe2e

      - name: Fail if the e2e profile executed zero tests
        run: |
          total=0
          for f in test-fixtures/target/failsafe-reports/TEST-*E2E.xml; do
            [ -e "$f" ] || continue
            n=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            total=$((total + n))
          done
          echo "E2E tests executed: $total"
          [ "$total" -gt 0 ]
