name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test (no Docker needed)
        run: ./mvnw -B verify

  # Invoker ITs (maven-plugin/src/it) run inside `verify` with the Maven that runs the build (D-012).
  # The wrapper pins 3.10.x; this matrix runs the latest 3.10.x and the latest Maven 4.0 from Maven Central.
  maven-matrix:
    name: verify (Maven ${{ matrix.maven }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        maven: ['3.10.0', '4.0.0-rc-7']
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Maven ${{ matrix.maven }}
        env:
          MAVEN_VERSION: ${{ matrix.maven }}
        run: |
          base="https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${MAVEN_VERSION}"
          archive="${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          curl -fsSL -o "${archive}" "${base}/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          echo "$(curl -fsSL "${base}/apache-maven-${MAVEN_VERSION}-bin.tar.gz.sha512")  ${archive}" | sha512sum -c -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}/bin" >> "${GITHUB_PATH}"

      - name: Build and test with that Maven (no Docker needed)
        run: |
          mvn -B -version
          mvn -B verify

  # Gradle plugin (D-002, D-075): a separate Gradle build that consumes core and the harness from the local Maven repository.
  # The matrix runs the whole Gradle build (compile, TestKit tests, KMP sample) under the latest Gradle 8.x and the latest
  # 9.x (D-093). The root wrapper is pinned to 9.5.0 for local builds; each leg rewrites the distribution URL in
  # gradle/wrapper/gradle-wrapper.properties to its own version first (there is no Gradle build at the root, so the wrapper task
  # cannot be used), and the rewrite is not committed.
  gradle-plugin:
    name: gradle-plugin (JDK ${{ matrix.java }}, Gradle ${{ matrix.gradle }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
        gradle: ['8.14.6', '9.8.2']
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Install core and the harness into the local Maven repository
        run: ./mvnw -B -ntp install -DskipTests -Dinvoker.skip=true

      - name: Select Gradle ${{ matrix.gradle }} for this leg (not committed)
        env:
          GRADLE_VERSION: ${{ matrix.gradle }}
        run: >-
          sed -i "s#gradle-[0-9.]*-bin\.zip#gradle-${GRADLE_VERSION}-bin.zip#"
          gradle/wrapper/gradle-wrapper.properties

      - name: Build and test the Gradle plugin (includes the version sync check)
        run: ./gradlew -p gradle-plugin build
